name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Run lint
        run: pnpm lint

  unit:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://rpg2d:rpg2d@localhost:5432/rpg2d
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rpg2d
          POSTGRES_USER: rpg2d
          POSTGRES_PASSWORD: rpg2d
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rpg2d -d rpg2d"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            if (echo > /dev/tcp/localhost/5432) >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          echo "PostgreSQL did not become ready in time"
          exit 1

      - name: Run database migrations
        run: pnpm db:migrate

      - name: Run unit tests
        run: pnpm test
