name: Deploy

# Required GitHub environment: production
#
# Secrets:
#   DATABASE_URL, SESSION_SECRET, AUTH0_DOMAIN, AUTH0_CLIENT_ID, AUTH0_CLIENT_SECRET
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, CLOUDFLARE_API_TOKEN
#
# Variables:
#   AWS_REGION, AWS_LAMBDA_FUNCTION_NAME, FRONTEND_ORIGIN, VITE_API_BASE_URL
#   CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_PAGES_PROJECT_EDITOR, CLOUDFLARE_PAGES_PROJECT_RUNTIME
#
# Prerequisites:
#   - Neon database with pg_trgm enabled via migrations
#   - AWS resources created via `infra/aws` Terraform (Lambda + Function URL)
#   - Two Cloudflare Pages projects (editor, runtime)
#
# Default Lambda function name from Terraform: RPG2d-api

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate database
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy-api:
    name: Deploy API to Lambda
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Build Lambda bundle
        run: pnpm build:api:lambda

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Package Lambda bundle
        run: |
          cd apps/api/dist/lambda
          zip -q ../lambda.zip index.mjs

      - name: Update Lambda code
        run: |
          aws lambda update-function-code \
            --function-name "${{ vars.AWS_LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://apps/api/dist/lambda.zip

      - name: Update Lambda configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.AUTH0_CLIENT_SECRET }}
          FRONTEND_ORIGIN: ${{ vars.FRONTEND_ORIGIN }}
        run: |
          jq -n \
            --arg NODE_ENV production \
            --arg DATABASE_DRIVER neon \
            --arg DATABASE_URL "$DATABASE_URL" \
            --arg SESSION_SECRET "$SESSION_SECRET" \
            --arg AUTH0_DOMAIN "$AUTH0_DOMAIN" \
            --arg AUTH0_CLIENT_ID "$AUTH0_CLIENT_ID" \
            --arg AUTH0_CLIENT_SECRET "$AUTH0_CLIENT_SECRET" \
            --arg FRONTEND_ORIGIN "$FRONTEND_ORIGIN" \
            '{Variables: {
              NODE_ENV: $NODE_ENV,
              DATABASE_DRIVER: $DATABASE_DRIVER,
              DATABASE_URL: $DATABASE_URL,
              SESSION_SECRET: $SESSION_SECRET,
              AUTH0_DOMAIN: $AUTH0_DOMAIN,
              AUTH0_CLIENT_ID: $AUTH0_CLIENT_ID,
              AUTH0_CLIENT_SECRET: $AUTH0_CLIENT_SECRET,
              FRONTEND_ORIGIN: $FRONTEND_ORIGIN
            }}' > lambda-env.json
          aws lambda update-function-configuration \
            --function-name "${{ vars.AWS_LAMBDA_FUNCTION_NAME }}" \
            --runtime nodejs24.x \
            --handler index.handler \
            --environment file://lambda-env.json

  deploy-editor:
    name: Deploy editor to Cloudflare Pages
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Build editor
        run: pnpm build:editor
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/editor/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_EDITOR }} --branch=main

  deploy-runtime:
    name: Deploy runtime to Cloudflare Pages
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Write runtime config
        run: pnpm write-runtime-config
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Build runtime
        run: pnpm build:runtime

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/runtime/dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_RUNTIME }} --branch=main
