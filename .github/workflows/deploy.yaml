name: Deploy

# HCP Terraform:
#   - Terraform state is stored in HCP Terraform.
#   - Provider credentials (AWS, Cloudflare, Auth0, Neon, etc.)
#     are configured in the HCP Terraform workspace.
#
# GitHub environment: production
#
# Secrets:
#   TFC_TOKEN
#   DATABASE_URL
#
# Variables:
#   TFC_ORGANIZATION
#   TFC_WORKSPACE
#
# Prerequisites:
#   - CI workflow has completed successfully on main
#   - HCP Terraform workspace is configured for remote state
#   - Provider credentials are configured in HCP Terraform
#   - pnpm build:aws writes all Terraform artifacts under
#     infra/terraform/artifacts/

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Migrate database
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Run database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  deploy:
    name: Deploy with Terraform
    needs: migrate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup project
        uses: ./.github/actions/setup

      - name: Build AWS artifacts
        run: pnpm build:aws

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          cli_config_credentials_token: ${{ secrets.TFC_TOKEN }}

      - name: Terraform init
        working-directory: infra/terraform
        run: terraform init

      - name: Terraform apply
        working-directory: infra/terraform
        run: terraform apply -auto-approve
