services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: rpg2d
      POSTGRES_USER: rpg2d
      POSTGRES_PASSWORD: rpg2d
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - db-data:/var/lib/postgresql/data

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:8081:8080'

volumes:
  db-data:
